name: Deploy visitor worker to Cloudflare

on:
  push:
    branches:
      - master
    # Only redeploy when the worker (or this workflow) actually changed.
    paths:
      - "visitor-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: "visitor-worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: visitor-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: visitor-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # RESEND_API_KEY and HASH_SALT already live in Cloudflare as worker
      # secrets; deploying doesn't touch them.
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
